spring:
  application:
    name: api
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    enabled: false
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
  mail:
    host: ${EMAIL_HOST}
    port: ${EMAIL_PORT}
    username: ${EMAIL_HOST_USER}
    password: ${EMAIL_HOST_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: ${EMAIL_USE_TLS:true}
    from: ${EMAIL_HOST_USER}
app:
  frontend:
    url: ${FRONTEND_URL}
  jwt:
    secret: ${JWT_SECRET}
    access-expiration: 600000
    refresh-expiration: 604800000
  cors:
    allowed-origins: ${CORS_ORIGINS}
  cookie:
    secure: false
  banks:
    cache:
      ttl-seconds: 86400
paystack:
  secret-key: ${PAYSTACK_SECRET_KEY}
  public-key: ${PAYSTACK_PUBLIC_KEY}
dojah:
  client-id: ${DOJAH_CLIENT_ID}
  client-secret: ${DOJAH_CLIENT_SECRET}
  base-url: ${DOJAH_BASE_URL}
  business-ref-id: ${DOJAH_BUSINESS_REF_ID}